[project]
name = "intro-specter"
version = "0.0.1"
description = "Abductive assumption attribution and selective repair for profile-grounded agent self-correction (NeurIPS 2026)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "networkx>=3.2",
    "anthropic>=0.40",
    "openai>=1.50",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.7",
    "tenacity>=8.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
intro-specter = "intro_specter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["intro_specter"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
