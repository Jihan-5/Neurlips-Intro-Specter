# Cross-family run on PFQABench-Recon, DeepSeek V3 (vs Llama 3.3 70B headline).
# Same examples and seeds as the Llama headline so paired stats per (task_id, seed)
# can compare cross-model performance directly.
benchmark: pfqa_recon
split: test
n_examples: 100
seeds: [0, 1, 2]
output_dir: outputs/tier_a/pfqa_deepseek
cache_path: cache/completions.sqlite
verifier_provider: null
verifier_model: ""

methods:
  - name: direct
    provider_name: together
    model: deepseek-ai/DeepSeek-V3
  - name: self_refine
    provider_name: together
    model: deepseek-ai/DeepSeek-V3
  - name: reflexion
    provider_name: together
    model: deepseek-ai/DeepSeek-V3
    extra:
      max_trials: 2
  - name: full_regen
    provider_name: together
    model: deepseek-ai/DeepSeek-V3
    extra:
      max_attempts: 1
  - name: intro_specter_llm
    provider_name: together
    model: deepseek-ai/DeepSeek-V3
    temperature: 0.0
    extra:
      tau_abstain: 0.0
      n_counterfactual_trials: 1
