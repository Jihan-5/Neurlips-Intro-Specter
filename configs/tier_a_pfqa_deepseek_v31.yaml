# PFQABench-Recon × DeepSeek V3.1 (within-family replication of V3).
benchmark: pfqa_recon
split: test
n_examples: 100
seeds: [0, 1, 2]
output_dir: outputs/tier_a/pfqa_deepseek_v31
cache_path: cache/completions.sqlite
verifier_provider: null
verifier_model: ""

methods:
  - name: direct
    provider_name: together
    model: deepseek-ai/DeepSeek-V3.1
  - name: self_refine
    provider_name: together
    model: deepseek-ai/DeepSeek-V3.1
  - name: reflexion
    provider_name: together
    model: deepseek-ai/DeepSeek-V3.1
    extra:
      max_trials: 2
  - name: full_regen
    provider_name: together
    model: deepseek-ai/DeepSeek-V3.1
    extra:
      max_attempts: 1
  - name: intro_specter_llm
    provider_name: together
    model: deepseek-ai/DeepSeek-V3.1
    temperature: 0.0
    extra:
      tau_abstain: 0.0
      n_counterfactual_trials: 1
