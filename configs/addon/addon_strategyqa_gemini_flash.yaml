n_examples: 100
seeds:
- 0
- 1
- 2
output_dir: outputs/tier_b/strategyqa_gemini_flash
cache_path: cache/completions.sqlite
verifier_provider: null
verifier_model: ''
methods:
- name: react
  provider_name: openrouter
  model: google/gemini-2.5-flash
  extra:
    max_steps: 4
- name: selfcheckgpt
  provider_name: openrouter
  model: google/gemini-2.5-flash
