# Tier-B HotpotQA-recon, 4-model spread on the IS winners + Llama 70B control.
# Single config that runs all 4 models in sequence. Cheapest path to Tier-B coverage.
benchmark: hotpotqa_recon
split: test
n_examples: 100
seeds: [0, 1, 2]
output_dir: outputs/tier_b/hotpotqa_quad
cache_path: cache/completions.sqlite
verifier_provider: null
verifier_model: ""

methods:
  # Llama 3.3 70B control
  - {name: direct,            provider_name: together, model: meta-llama/Llama-3.3-70B-Instruct-Turbo}
  - {name: intro_specter_llm, provider_name: together, model: meta-llama/Llama-3.3-70B-Instruct-Turbo, temperature: 0.0, extra: {tau_abstain: 0.0, n_counterfactual_trials: 1}}
